<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">Curriculum Map</h1>
      <p class="app-subtitle">Designed by Dr. Michael J. Katz</p>
    </div>

    <div class="header-right">
      <div class="tier-toggles" id="tierToggles" aria-label="Toggle connection tiers">
        <!-- populated by js/render.js from connections.json legend -->
      </div>

      <!-- Styled Add Course Button -->
      <button id="addCourseBtn" class="btn btn-secondary" onclick="window.openCourseEditor(null)">
        <span class="btn-icon">+</span>
        <span>Add Course</span>
      </button>

      <div class="connect-tools" style="display: flex; gap: 8px; align-items: center; border: 1px solid black; padding: 4px 8px; border-radius: 4px;">
        <button id="connectModeBtn" class="btn btn-secondary">
          🔗 Connect Mode: OFF
        </button>
        
        <!-- Connection Level Selector -->
        <select id="connectionTypeSelect" class="btn btn-secondary" style="padding: 6px 10px;" title="Select Connection Type">
          <option value="strong">Strong</option>
          <option value="related" selected>Related</option>
          <option value="weak">Weak</option>
        </select>
      </div>

      <!-- Toolbar Export/Import Controls -->
      <div class="toolbar-actions">
        <button id="exportBtn" class="btn btn-secondary">
          ⬇️ Save Workspace
        </button>

        <input type="file" id="importFileInput" accept=".json" style="display: none;" />
        
        <button id="importBtn" class="btn btn-secondary">
          ⬆️ Load Workspace
        </button>

        <button onclick="downloadAllCourseOutlinesRTF()" class="btn btn-outline-primary">
          📄 Download All Outlines (RTF)
        </button>
      </div>
    </div>
  </header>

  <main class="board-wrap">
    <svg id="connectionLayer" class="connection-layer" aria-hidden="true"></svg>
    <div class="board" id="board">
      <!-- year columns injected here -->
    </div>
  </main>

  <!-- Course Editor Modal -->
  <div id="courseModal" class="modal-overlay hidden">
    <div class="modal-container">
      <div class="modal-header">
        <h2 id="modalTitle">Course Editor</h2>
        <button class="close-btn" onclick="closeCourseModal()">&times;</button>
      </div>

      <!-- Modal Tabs -->
      <div class="modal-tabs">
        <button class="tab-btn active" onclick="switchTab('general')">General Info</button>
        <button class="tab-btn" onclick="switchTab('modules')">Modules (<span id="moduleCount">0</span>)</button>
        <button class="tab-btn" onclick="switchTab('connections')">Connections (<span id="connCount">0</span>)</button>
      </div>

      <div class="modal-body">
        <!-- TAB 1: General Info -->
        <div id="tab-general" class="tab-content active">
          <div class="form-grid">
            <div class="form-group">
              <label for="courseId">Course ID</label>
              <input type="text" id="courseId" placeholder="e.g. chem1010">
            </div>
            <div class="form-group">
              <label for="courseCode">Course Code</label>
              <input type="text" id="courseCode" placeholder="e.g. CHEM 1010">
            </div>
            <div class="form-group full-width">
              <label for="courseName">Course Name</label>
              <input type="text" id="courseName" placeholder="e.g. Introductory Chemistry I">
            </div>
            <div class="form-group">
              <label for="courseYear">Year</label>
              <input type="number" id="courseYear" value="1">
            </div>
            <div class="form-group">
              <label for="courseYearLabel">Year Label</label>
              <input type="text" id="courseYearLabel" placeholder="e.g. Year 1 (Fall)">
            </div>
          </div>

          <h3>Schedule Configuration</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="weeksInSemester">Semester Duration</label>
              <select id="weeksInSemester">
                <option value="10">10 Weeks (Quarter/Term)</option>
                <option value="12" selected>12 Weeks (Standard)</option>
                <option value="14">14 Weeks</option>
                <option value="15">15 Weeks</option>
                <option value="16">16 Weeks</option>
              </select>
            </div>

            <div class="form-group">
              <label for="weeklyFormat">Weekly Format</label>
              <select id="weeklyFormat" onchange="typeof handleFormatChange === 'function' && handleFormatChange(this.value)">
                <option value="3x50" selected>3 Lectures / week (50 mins each)</option>
                <option value="2x90">2 Lectures / week (~90 mins each)</option>
                <option value="1x180">1 Seminar / week (3 hours)</option>
              </select>
            </div>
          </div>

          <h3>Textbook Information</h3>
          <div class="form-grid">
            <div class="form-group full-width">
              <label for="tbTitle">Title</label>
              <input type="text" id="tbTitle" placeholder="e.g. Chemistry: The Central Science">
            </div>
            <div class="form-group">
              <label for="tbAuthor">Author</label>
              <input type="text" id="tbAuthor">
            </div>
            <div class="form-group">
              <label for="tbEdition">Edition</label>
              <input type="text" id="tbEdition">
            </div>
          </div>
        </div>

        <!-- TAB 2: Modules Manager -->
        <div id="tab-modules" class="tab-content">
          <div class="tab-actions" style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="btn btn-secondary" onclick="addModuleRow()">+ Add Module</button>
            <button type="button" class="btn btn-secondary" onclick="addMidtermRow()" style="border-color: #a855f7; color: #c084fc;">+ Add Midterm</button>
            <button type="button" class="btn btn-secondary" onclick="addLabRow()" style="border-color: #06b6d4; color: #67e8f9;">+ Add Lab Section</button>
          </div>
          <div id="moduleList" class="manager-list">
            <!-- Dynamic Module Rows inserted here -->
          </div>
        </div>

        <!-- TAB 3: Connections Manager -->
        <div id="tab-connections" class="tab-content">
          <div class="tab-actions">
            <button class="btn btn-secondary" onclick="addConnectionRow()">+ Add Connection</button>
          </div>
          <div id="connectionList" class="manager-list">
            <!-- Dynamic Connection Rows inserted here -->
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closeCourseModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveCourseData()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Calendar View Modal -->
  <div id="calendar-modal" class="modal-overlay hidden">
    <div class="modal-card calendar-modal-card">
      <div class="modal-header">
        <h2 id="calendar-modal-title">Course Calendar View</h2>
        <button class="close-modal-btn" onclick="closeCalendarModal()">&times;</button>
      </div>
      <div id="calendar-grid" class="calendar-grid">
        <!-- Calendar weeks/lectures injected by JS -->
      </div>
    </div>
  </div>

  <aside class="detail-drawer" id="detailDrawer" aria-live="polite">
    <div class="drawer-empty" id="drawerEmpty">
      <p>Select a module to see its topics, objectives, and everything it connects to across the years.</p>
    </div>
    <div class="drawer-content" id="drawerContent" hidden></div>
  </aside>

  <footer class="legend-bar" id="legendBar">
    <!-- populated by js/render.js from connections.json legend -->
  </footer>

  <script src="js/data-loader.js"></script>
  <script src="js/render.js"></script>
  <script src="js/connections.js"></script>
  <script src="js/courseEditor.js"></script>
  <script src="js/calendarView.js"></script>
  <script src="js/exportRtf.js"></script>
  <script type="module" src="js/main.js"></script>

</body>
</html>
